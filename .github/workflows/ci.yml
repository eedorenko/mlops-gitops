    #     if [ -z "$MODEL_VERSION" ]; then
    #       MODEL_VERSION=$(az ml model list  -n $MODEL_NAME  -w $ML_WORKSPACE -g $RESOURCE_GROUP -l | jq -r '.[0].version') 
    #     fi
        
    #     mkdir -p model
