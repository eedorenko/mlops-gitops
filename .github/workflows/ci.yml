name: ci

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      model_version:
        required: false
        type: string
        description: 'ML model vserion'

env:
  SEM_VER: 0.0.1
  IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}


jobs:
  Build_Push_Image:
    runs-on: ubuntu-latest
    # needs: [quality-check]
    permissions: write-all

    steps:
    - name: Checkout Source
      uses: actions/checkout@v3


