apiVersion: v1
kind: Service
metadata:
  name: {{  .Values.task.name}}-service
  {{ if .Values.namespace }}    
  namespace: {{  .Values.namespace}}
  {{ end }}    
spec:
  selector:
    task: {{  .Values.task.name}}
  ports:
    - protocol: TCP
      port: {{  .Values.port}}
      targetPort: {{  .Values.port}}
